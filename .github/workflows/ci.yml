name: Offline scaffold checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Offline by design: no secrets, no database and no paid inference.
    env:
      APP_MODE: fixture
      HF_TOKEN: ''
      DATABASE_URL: ''
      TEST_DATABASE_URL: ''
      EXPERIMENT_BUDGET_LIMIT: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.lock
      - run: npm --prefix frontend ci
      - run: python -m pytest backend/tests
      - run: python -m ruff check backend
      - run: python -m backend.scripts.validate_agents
      - name: C demo slice evidence (offline checks; live checks report not_established)
        run: python -m backend.app.features.evolution.demo_evidence
      - run: python -m backend.scripts.export_openapi
      - run: npm --prefix frontend run generate:api
      - run: npm --prefix frontend run check:contracts
      - name: Verify committed generated contracts
        run: git diff --exit-code -- shared/openapi.json frontend/src/shared/api-types.ts
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build
